name: Build and publish Shinri Tracker

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Tesseract OCR
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          $tess = "C:\Program Files\Tesseract-OCR"
          if (!(Test-Path "$tess\tessdata\rus.traineddata")) {
            Invoke-WebRequest `
              "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/rus.traineddata" `
              -OutFile "$tess\tessdata\rus.traineddata"
          }

      - name: Prepare version and updater config
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          [IO.File]::WriteAllText("version.txt", $version, [Text.UTF8Encoding]::new($false))

          $parts = "${{ github.repository }}".Split("/")
          $config = @{
            github_owner = $parts[0]
            github_repo = $parts[1]
            asset_name = "ShinriTracker.exe"
            auto_check = $true
          } | ConvertTo-Json
          [IO.File]::WriteAllText("update_config.json", $config, [Text.UTF8Encoding]::new($false))

      - name: Add Google OAuth credentials
        shell: pwsh
        env:
          GOOGLE_OAUTH_JSON: ${{ secrets.GOOGLE_OAUTH_JSON }}
        run: |
          if ($env:GOOGLE_OAUTH_JSON) {
            [IO.File]::WriteAllText(
              "google_credentials.json",
              $env:GOOGLE_OAUTH_JSON,
              [Text.UTF8Encoding]::new($false)
            )
          } else {
            Write-Host "GOOGLE_OAUTH_JSON secret is not set. Shared Groups will be disabled in this build."
          }

      - name: Build EXE
        shell: pwsh
        run: |
          $tess = "C:\Program Files\Tesseract-OCR"
          $args = @(
            "-m", "PyInstaller",
            "--noconfirm",
            "--clean",
            "--onefile",
            "--windowed",
            "--name", "ShinriTracker",
            "--icon=icon.ico",
            "--add-data", "icon.png;.",
            "--add-data", "version.txt;.",
            "--add-data", "update_config.json;.",
            "--add-data", "$tess;tesseract",
            "--collect-all", "googleapiclient",
            "--collect-all", "google_auth_httplib2",
            "--collect-all", "google_auth_oauthlib"
          )

          if (Test-Path "google_credentials.json") {
            $args += @("--add-data", "google_credentials.json;.")
          }

          $args += "main.py"
          python @args

      - name: Calculate SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist\ShinriTracker.exe" -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText(
            "dist\ShinriTracker.exe.sha256",
            "$hash  ShinriTracker.exe`n",
            [Text.UTF8Encoding]::new($false)
          )

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag `
              "dist\ShinriTracker.exe" `
              "dist\ShinriTracker.exe.sha256" `
              --clobber
          } else {
            gh release create $tag `
              "dist\ShinriTracker.exe" `
              "dist\ShinriTracker.exe.sha256" `
              --title $tag `
              --generate-notes
          }
